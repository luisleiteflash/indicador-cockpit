<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Comercial — Mural</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    /* mesma paleta dos paineis Meli B2B / Pulso B2B / Faturamento */
    --bg:        #0a0c11;
    --card:      #12151b;
    --card-2:    #171b23;
    --line:      rgba(255,255,255,0.07);
    --line-soft: rgba(255,255,255,0.045);
    --line-strong: rgba(255,255,255,0.16);
    --ink:       #f3f5f8;
    --ink-2:     #8a93a6;
    --ink-3:     #57606f;
    --accent:    #437fef;
    --brand:     #0a2f74;
    --ftl:       #f1860a;
    --opd:       #437fef;
    --exp:       #22c55e;
    --hist:      #8a93a6;
    --meta:      #f1860a;
    --pos:       #22c55e;
    --neg:       #ef4444;
    --pos-bg:    rgba(34,197,94,0.14);
    --neg-bg:    rgba(239,68,68,0.14);
    --warn:      #eab308;
    --warn-bg:   rgba(234,179,8,0.14);
    --grid:      rgba(255,255,255,0.06);
    --r:         0.75rem;
    --font-ui:   "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    /* margem de seguranca contra o overscan da TV (a TV amplia a imagem e
       corta uma faixa de cada borda). Ajustavel pelo endereco: ?safe=0 a 10  */
    --safe-x:    3vw;
    --safe-y:    3vh;
  }

  * { box-sizing: border-box; }
  html {
    font-size: calc(0.72vh + 0.42vw);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    color-scheme: dark;
  }
  body {
    margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg);
    background-image:
      radial-gradient(1000px 420px at 8% -12%, rgba(59,130,246,0.06), transparent 60%),
      radial-gradient(800px 360px at 100% -6%, rgba(59,130,246,0.04), transparent 55%);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .board {
    height: 100%;
    padding: calc(0.5rem + var(--safe-y)) calc(0.55rem + var(--safe-x)) calc(0.6rem + var(--safe-y));
    display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.9rem;
  }

  /* ---------------- topo ---------------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; padding-bottom: 0.7rem; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 0.85rem; min-width: 0; }
  .idt { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
  .idt .l1 { display: flex; align-items: center; gap: 0.85rem; }
  .brand h1 {
    font-family: var(--font-ui); font-weight: 800; font-size: 2.15rem;
    letter-spacing: -.025em; margin: 0; line-height: 1;
  }
  .brand .tag {
    font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .brand .sep { width: 1px; height: 1.2rem; background: var(--line-strong); display: inline-block; }
  .brand .scope { font-size: 0.92rem; color: var(--ink-3); }
  .stampbar { display: flex; align-items: flex-end; gap: 1.6rem; }
  .stampbar > div { text-align: right; }
  .stampbar .k {
    font-family: var(--font-ui); font-size: 0.66rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
    white-space: nowrap;
  }
  .stampbar .v {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.18rem;
    letter-spacing: -.01em; margin-top: .1rem; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .logo {
    background: #fff; border-radius: .5rem; padding: .45rem .65rem;
    display: flex; align-items: center; flex: none;
    box-shadow: 0 .15rem .7rem rgba(0,0,0,.35);
  }
  .logo img { display: block; height: 1.65rem; width: auto; }
  .live { display: inline-flex; align-items: center; gap: .4rem; }
  .pulse {
    width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(63,181,164,.55); animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,181,164,.5); }
    70% { box-shadow: 0 0 0 .55rem rgba(63,181,164,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,181,164,0); }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  /* ---------------- tela dividida ---------------- */
  .split { display: grid; grid-template-columns: 1.18fr 1fr; gap: 1rem; min-height: 0; }
  .lado { display: grid; min-height: 0; gap: 0.7rem; }
  .lado.esq { grid-template-rows: auto auto 1.3fr 1fr auto; }
  .lado.dir { grid-template-rows: minmax(0, 1fr); position: relative; }
  .lado.dir::before {
    content: ""; position: absolute; left: -0.5rem; top: .2rem; bottom: .2rem;
    width: 1px; background: var(--line);
  }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.8rem 1rem 0.85rem; min-height: 0;
    display: flex; flex-direction: column; gap: 0.55rem;
  }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
  .panel h2 {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.28rem;
    letter-spacing: -.01em; margin: 0;
  }
  .phead .sub {
    font-family: var(--font-ui); font-size: 0.82rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .dot { width: .62rem; height: .62rem; border-radius: 2px; display: inline-block; flex: none; }
  .foot-note { font-size: 0.92rem; color: var(--ink-3); line-height: 1.35; }
  .foot-note strong { color: var(--ink); }

  /* ---------------- indicadores ---------------- */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.7rem 0.9rem 0.75rem; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--line); }
  .kpi.a::before { background: var(--accent); }
  .kpi.b::before { background: var(--meta); }
  .kpi.c::before { background: var(--exp); }
  .kpi .label {
    font-family: var(--font-ui); font-size: 0.68rem;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
    line-height: 1.2; min-height: 1.3em; display: flex; align-items: flex-end;
  }
  .kpi .value {
    font-family: var(--font-ui); font-weight: 700; font-size: 2.3rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    line-height: 1.08; margin-top: .12rem; white-space: nowrap;
  }
  .kpi .qtd { font-size: 0.9rem; color: var(--ink-2); margin-top: .1rem; }
  .kpi .nota { font-size: 0.76rem; color: var(--ink-3); margin-top: .12rem; line-height: 1.3; }

  /* ---------------- faixa da taxa de conversao ---------------- */
  .conv {
    display: flex; align-items: center; gap: .9rem;
    background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--pos); border-radius: var(--r);
    padding: .5rem .9rem .55rem;
  }
  .conv b {
    font-family: var(--font-ui); font-weight: 800; font-size: 1.9rem;
    letter-spacing: -.03em; color: var(--pos); line-height: 1; flex: none;
  }
  .conv span { font-size: 0.95rem; color: var(--ink-2); line-height: 1.3; }

  /* ---------------- funil de fases ---------------- */
  .funil { display: flex; flex-direction: column; gap: .3rem; flex: 1 1 auto; justify-content: space-evenly; min-height: 0; }
  .fase {
    display: grid; grid-template-columns: 7.6rem minmax(0, 1fr) auto;
    gap: 0 .7rem; align-items: center;
  }
  .fase-n { font-size: 1rem; color: var(--ink-2); white-space: nowrap; }
  .fase-track { height: 1.4rem; border-radius: .3rem; background: var(--line-soft); overflow: hidden; position: relative; }
  .fase-track i {
    display: block; height: 100%; border-radius: .3rem;
    background: linear-gradient(90deg, var(--accent), #6aa0ff);
  }
  .fase-track b {
    position: absolute; left: .5rem; top: 0; height: 100%;
    display: flex; align-items: center;
    font-family: var(--font-ui); font-weight: 700; font-size: .98rem; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .fase-cv {
    font-family: var(--font-ui); font-size: 0.86rem; font-weight: 600;
    color: var(--ink-3); min-width: 3.4rem; text-align: right; white-space: nowrap;
  }

  /* ---------------- novas prospeccoes ---------------- */
  .prospec { display: flex; flex-direction: column; gap: .5rem; flex: 1 1 auto; min-height: 0; }
  .prospec-item {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 .6rem; align-items: center;
    flex: 1 1 0; min-height: 0; padding: .45rem .7rem; background: var(--card-2);
    border: 1px solid var(--line-soft); border-left: 2px solid var(--accent); border-radius: .5rem;
  }
  .prospec-item i {
    width: .45rem; height: .45rem; border-radius: 50%; background: var(--accent);
    flex: none;
  }
  .prospec-item p { margin: 0; font-size: 0.98rem; line-height: 1.35; color: var(--ink-2); }
  .prospec-item p b { color: var(--ink); font-weight: 700; }

  /* ---------------- negocio perdido ---------------- */
  .perdido {
    display: flex; align-items: center; gap: .6rem;
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.28);
    border-radius: .55rem; padding: .4rem .75rem;
    font-size: 0.9rem; color: var(--ink-2); line-height: 1.3;
  }
  .perdido b {
    font-family: var(--font-ui); font-size: 0.7rem; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; color: var(--neg);
    white-space: nowrap; flex: none;
  }

  /* ---------------- contas (lado direito) ---------------- */
  .grupos { display: flex; flex-direction: column; gap: .6rem; flex: 1 1 auto; min-height: 0; }
  .grupo { display: flex; flex-direction: column; min-height: 0; }
  .g-cab {
    display: grid; grid-template-columns: auto 1fr auto; gap: 0 .55rem;
    align-items: baseline; padding-bottom: .2rem; margin-bottom: .3rem;
    border-bottom: 1px solid var(--line-strong);
  }
  .g-nome {
    font-family: var(--font-ui); font-size: .84rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: .35rem;
  }
  .g-qtd { font-family: var(--font-ui); font-size: .8rem; font-weight: 600; color: var(--ink-3); }
  .g-tot {
    font-family: var(--font-ui); font-size: 1.08rem; font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right;
  }

  .conta {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: .05rem .7rem; align-content: center;
    flex: 1 1 0; min-height: 0; padding: .1rem 0;
  }
  .c-top { display: flex; align-items: baseline; gap: .45rem; min-width: 0; }
  .c-nome {
    font-size: 1.06rem; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pill {
    font-family: var(--font-ui); font-size: 0.62rem; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase;
    padding: .06rem .4rem; border-radius: 999px; flex: none; white-space: nowrap;
  }
  .c-val {
    grid-column: 2; grid-row: 1; text-align: right; white-space: nowrap;
    font-family: var(--font-ui); font-weight: 700; font-size: 1.12rem;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .c-acao {
    grid-column: 1; grid-row: 2; font-size: 0.88rem; color: var(--ink-2); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .c-meta {
    grid-column: 2; grid-row: 2; text-align: right; white-space: nowrap;
    font-family: var(--font-ui); font-size: 0.76rem; color: var(--ink-3);
  }
  /* muitas contas: a proxima acao encolhe para nao cortar no meio da linha */
  .grupos.denso .c-acao { -webkit-line-clamp: 1; }
  .grupos.denso .c-nome { font-size: 1rem; }
  .grupos.denso .c-val  { font-size: 1.04rem; }
  .grupos.muito-denso .c-acao { -webkit-line-clamp: 1; font-size: 0.82rem; }
  .grupos.muito-denso .c-nome { font-size: 0.94rem; }
  .grupos.muito-denso .c-val  { font-size: 0.98rem; }
  .grupos.muito-denso .c-meta { font-size: 0.7rem; }
  .grupos.muito-denso .pill   { font-size: 0.56rem; }

  .g-rodape {
    display: flex; align-items: baseline; justify-content: space-between; gap: .6rem;
    padding: .45rem .8rem; margin-top: .1rem;
    background: var(--card-2); border: 1px solid var(--line-soft); border-radius: .55rem;
  }
  .g-rodape span { font-size: 0.92rem; color: var(--ink-3); }
  .g-rodape b {
    font-family: var(--font-ui); font-weight: 700; font-size: 1.5rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }

  .empty {
    padding: .6rem .8rem; border-radius: .55rem; background: var(--card-2);
    border: 1px dashed var(--line); color: var(--ink-3); font-size: 0.85rem; line-height: 1.35;
  }

  /* aviso de dados ausentes */
  #alerta {
    position: fixed; right: calc(0.55rem + var(--safe-x)); bottom: calc(0.5rem + var(--safe-y));
    background: var(--card); border: 1px solid var(--neg); color: var(--ink);
    border-radius: .6rem; padding: .6rem .9rem; font-size: .85rem; max-width: 34rem;
    box-shadow: 0 .6rem 2rem rgba(0,0,0,.5);
  }
  #alerta b { color: var(--neg); }
  #alerta.hide { display: none; }

  /* telas verticais / quadradas: empilha os dois lados */
  @media (max-aspect-ratio: 1/1) {
    .split { grid-template-columns: 1fr; grid-template-rows: 1.2fr 1fr; }
    .lado.dir::before { display: none; }
  }
</style>
</head>

<script>
(function () {
  var local = location.protocol === "file:";
  var s = document.createElement("script");
  s.src = local ? "dados.js" : "dados.js?v=" + Date.now();
  s.onload = s.onerror = function () { if (window.__COCKPIT_INIT) window.__COCKPIT_INIT(); };
  document.head.appendChild(s);
  setTimeout(function () { location.reload(); }, 10 * 60 * 1000);
})();
</script>
<script>
window.__COCKPIT_INIT = function () {
  "use strict";

  /* ---------------- utilitarios ---------------- */
  const br = (n, d) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (n, d) => br(n * 100, d === undefined ? 0 : d) + "%";
  const soma = a => a.reduce((x, y) => x + y, 0);
  const el = id => document.getElementById(id);
  const txt = (id, v) => { const e = el(id); if (e) e.textContent = v; };
  const html = (id, v) => { const e = el(id); if (e) e.innerHTML = v; };
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  /* "FECHADO / INICIADO" -> "fechadoiniciado" (sem acento), para virar classe */
  const slug = s => String(s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
  const cap = s => {
    const t = String(s || "").toLowerCase();
    return t.charAt(0).toUpperCase() + t.slice(1);
  };

  /* ---------------- margem de seguranca da TV ----------------
     Toda TV corta um pedaco das bordas (overscan). O padrao de 3% resolve a
     maioria; para ajustar, acrescente ?safe=N ao endereco (N de 0 a 10).    */
  (function () {
    try {
      const q = new URLSearchParams(location.search);
      if (!q.has("safe")) return;
      const n = parseFloat(String(q.get("safe")).replace(",", "."));
      if (!isFinite(n) || n < 0 || n > 10) return;
      document.documentElement.style.setProperty("--safe-x", n + "vw");
      document.documentElement.style.setProperty("--safe-y", n + "vh");
    } catch (e) { /* endereco sem parametros: fica no padrao */ }
  })();

  /* ---------------- dados ---------------- */
  const D = window.COCKPIT;
  if (!D || !D.kpis) {
    const a = el("alerta");
    a.innerHTML = '<b>Sem dados.</b> O arquivo <code>dados.js</code> não foi encontrado ou está vazio. ' +
                  'Rode o <b>Atualizar painel.bat</b> na pasta do PowerPoint.';
    a.classList.remove("hide");
    return;
  }

  /* ---------------- topo ---------------- */
  if (D.titulo) txt("t-titulo", D.titulo.replace(/\s+da\s+Semana\s*$/i, ""));
  txt("t-sub", D.subtitulo || "Oportunidades, pipeline por fase e contas em negociação");
  txt("s-sync", D.atualizado || "—");
  txt("s-arq", D.arquivo || "—");
  txt("s-semana", D.semana || "—");

  /* ---------------- indicadores ---------------- */
  (function () {
    const classes = ["a", "b", "c", "a"];
    const K = D.kpis || [];
    el("kpis").style.gridTemplateColumns = "repeat(" + Math.max(K.length, 1) + ", 1fr)";
    el("kpis").innerHTML = K.map((k, i) =>
      '<div class="kpi ' + classes[i % classes.length] + '">' +
        '<div class="label">' + esc(k.rotulo) + "</div>" +
        '<div class="value">' + esc(k.valor) + "</div>" +
        (k.qtd  ? '<div class="qtd">'  + esc(k.qtd)  + "</div>" : "") +
        (k.nota ? '<div class="nota">' + esc(k.nota) + "</div>" : "") +
      "</div>").join("");
  })();

  /* ---------------- faixa da taxa de conversao ---------------- */
  (function () {
    if (!D.conversaoTexto && !D.conversaoValor) return;
    el("conv").hidden = false;
    txt("conv-v", D.conversaoValor || "");
    txt("conv-t", D.conversaoTexto || "");
  })();

  /* ---------------- funil de fases ---------------- */
  (function () {
    const F = D.fases;
    if (!F || !F.cats || !F.cats.length) {
      html("funil", '<div class="empty">O slide não trouxe o gráfico de oportunidades por fase.</div>');
      return;
    }
    if (D.tituloFases) txt("t-fases", D.tituloFases);
    const total = soma(F.vals);
    const maxV = Math.max.apply(null, F.vals) || 1;
    txt("sub-fases", br(total, 0) + " oportunidades no funil");

    /* O PowerPoint desenha o grafico de baixo para cima: Fechamento no topo e
       Prospeccao embaixo. O painel segue a mesma ordem para a TV e o slide
       ficarem iguais. A conversao continua sendo a da fase anterior do funil,
       que nessa ordem e a linha de BAIXO.                                   */
    const linhas = F.cats.map((c, i) => {
      const v = F.vals[i] || 0;
      const ant = i ? (F.vals[i - 1] || 0) : 0;
      return {
        nome: c, valor: v,
        cv: i && ant ? "↓ " + pct(v / ant) : "—",
        rot: i ? "conversão vinda de " + F.cats[i - 1] : "topo do funil"
      };
    }).reverse();

    el("funil").innerHTML = linhas.map(l =>
      '<div class="fase">' +
        '<div class="fase-n">' + esc(l.nome) + "</div>" +
        '<div class="fase-track"><i style="width:' + (l.valor / maxV * 100).toFixed(1) + '%"></i>' +
          "<b>" + br(l.valor, 0) + "</b></div>" +
        '<div class="fase-cv" title="' + esc(l.rot) + '">' + l.cv + "</div>" +
      "</div>").join("");

    const ini = F.vals[0] || 0, fim = F.vals[F.vals.length - 1] || 0;
    html("nota-fases",
      "Do topo ao fechamento: <strong>" + br(ini, 0) + " → " + br(fim, 0) + "</strong> " +
      "(<strong>" + pct(ini ? fim / ini : 0, 1) + "</strong> fim a fim). " +
      '<span style="opacity:.75">Mesma ordem do slide. À direita de cada fase, a conversão vinda da fase de baixo.</span>');
  })();

  /* ---------------- novas prospeccoes ---------------- */
  (function () {
    const P = D.prospeccoes || [];
    if (D.tituloProspec) txt("t-prospec", D.tituloProspec);
    txt("sub-prospec", P.length ? P.length + (P.length === 1 ? " conta" : " frentes") : "");
    if (!P.length) {
      html("prospec", '<div class="empty">O slide não trouxe novas prospecções nesta semana.</div>');
      return;
    }
    /* o que vem antes do primeiro ":" e o nome da conta - fica em destaque */
    el("prospec").innerHTML = P.map(t => {
      const s = String(t);
      const i = s.indexOf(":");
      const corpo = i > 0 && i < 60
        ? "<b>" + esc(s.slice(0, i)) + "</b>" + esc(s.slice(i))
        : esc(s);
      return '<div class="prospec-item"><i></i><p>' + corpo + "</p></div>";
    }).join("");
  })();

  /* ---------------- negocio perdido ---------------- */
  (function () {
    if (!D.perdido) return;
    el("perdido").hidden = false;
    /* tira o rotulo repetido do inicio ("NEGOCIO PERDIDO (1):") */
    txt("perdido-t", String(D.perdido).replace(/^\s*neg[óo]cio\s+perdido\s*(\(\d+\))?\s*:?\s*/i, ""));
  })();

  /* ---------------- contas por grupo ---------------- */
  (function () {
    const G = D.grupos || [];
    if (D.tituloClientes) txt("t-clientes", D.tituloClientes);
    txt("sub-clientes", D.subtituloClientes || "");

    if (!G.length) {
      html("grupos", '<div class="empty">O slide não trouxe contas nesta semana.</div>');
      return;
    }

    /* cor por grupo: fechado = verde, negociacao = azul, o resto = laranja */
    const corDe = nome => {
      const k = slug(nome);
      if (k.indexOf("fechad") >= 0 || k.indexOf("iniciad") >= 0) return "--exp";
      if (k.indexOf("negoc") >= 0) return "--accent";
      return "--meta";
    };
    const fundo = cor => cor === "--exp" ? "rgba(34,197,94,.16)"
                       : cor === "--accent" ? "rgba(67,127,239,.16)"
                       : "rgba(241,134,10,.16)";

    /* densidade: com muitas contas a linha de acao precisa encolher */
    const totalContas = G.reduce((n, g) => n + ((g.contas || []).length), 0);
    const cx = el("grupos");
    cx.className = "grupos" + (totalContas > 14 ? " muito-denso" : totalContas > 9 ? " denso" : "");

    cx.innerHTML = G.map(g => {
      const cor = corDe(g.nome);
      const contas = g.contas || [];
      const meta = c => [c.previsao, c.resp].filter(Boolean).map(esc).join(" · ");
      return '<div class="grupo" style="flex:' + Math.max(contas.length, 1) + ' 1 0">' +
        '<div class="g-cab">' +
          '<div class="g-nome" style="color:var(' + cor + ')">' +
            '<i class="dot" style="background:var(' + cor + ')"></i>' + esc(g.nome) + "</div>" +
          '<div class="g-qtd">' + esc(g.qtd || (contas.length + " contas")) + "</div>" +
          '<div class="g-tot">' + esc(g.totalTxt || "") + "</div>" +
        "</div>" +
        contas.map(c =>
          '<div class="conta">' +
            '<div class="c-top">' +
              '<span class="c-nome">' + esc(c.nome) + "</span>" +
              (c.fase ? '<span class="pill" style="color:var(' + cor + ');background:' + fundo(cor) + '">' +
                        esc(c.fase) + "</span>" : "") +
            "</div>" +
            '<div class="c-val">' + esc(c.valorTxt || "") + "</div>" +
            '<div class="c-acao">' + esc(c.acao || "") + "</div>" +
            '<div class="c-meta">' + meta(c) + "</div>" +
          "</div>").join("") +
      "</div>";
    }).join("");

    if (D.totalValor) {
      el("rodape").hidden = false;
      txt("rod-l", D.totalLabel || "Total geral");
      txt("rod-v", D.totalValor);
    }
  })();
};
</script>

</body>
</html>
