<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Comercial — Mural</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    /* mesma paleta dos paineis Meli B2B / Pulso B2B / Faturamento */
    --bg:        #0a0c11;
    --card:      #12151b;
    --card-2:    #171b23;
    --line:      rgba(255,255,255,0.07);
    --line-soft: rgba(255,255,255,0.045);
    --line-strong: rgba(255,255,255,0.16);
    --ink:       #f3f5f8;
    --ink-2:     #8a93a6;
    --ink-3:     #57606f;
    --accent:    #437fef;
    --brand:     #0a2f74;
    --ftl:       #f1860a;
    --opd:       #437fef;
    --exp:       #22c55e;
    --hist:      #8a93a6;
    --meta:      #f1860a;
    --pos:       #22c55e;
    --neg:       #ef4444;
    --pos-bg:    rgba(34,197,94,0.14);
    --neg-bg:    rgba(239,68,68,0.14);
    --warn:      #eab308;
    --warn-bg:   rgba(234,179,8,0.14);
    --grid:      rgba(255,255,255,0.06);
    --r:         0.75rem;
    /* margem de seguranca contra o overscan da TV (a TV amplia a imagem e
       corta uma faixa de cada borda). Ajustavel pelo endereco: ?safe=0 a 10  */
    --safe-x:    3vw;
    --safe-y:    3vh;
    --font-ui:   "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html {
    font-size: calc(0.72vh + 0.42vw);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    color-scheme: dark;
  }
  body {
    margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg);
    background-image:
      radial-gradient(1000px 420px at 8% -12%, rgba(59,130,246,0.06), transparent 60%),
      radial-gradient(800px 360px at 100% -6%, rgba(59,130,246,0.04), transparent 55%);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .board {
    height: 100%;
    padding: calc(0.5rem + var(--safe-y)) calc(0.55rem + var(--safe-x)) calc(0.6rem + var(--safe-y));
    display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.9rem;
  }

  /* ---------------- topo ---------------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 0.85rem; min-width: 0; }
  .idt { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
  .idt .l1 { display: flex; align-items: center; gap: 0.85rem; }
  .brand h1 {
    font-family: var(--font-ui); font-weight: 800; font-size: 2.15rem;
    letter-spacing: -.025em; margin: 0; line-height: 1;
  }
  .brand .tag {
    font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .brand .sep { width: 1px; height: 1.2rem; background: var(--line-strong); display: inline-block; }
  .brand .scope { font-size: 0.92rem; color: var(--ink-3); }
  .stampbar { display: flex; align-items: flex-end; gap: 1.6rem; }
  .stampbar > div { text-align: right; }
  .stampbar .k {
    font-family: var(--font-ui); font-size: 0.66rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
    white-space: nowrap;
  }
  .stampbar .v {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.18rem;
    letter-spacing: -.01em; margin-top: .1rem; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .logo {
    background: #fff; border-radius: .5rem; padding: .45rem .65rem;
    display: flex; align-items: center; flex: none;
    box-shadow: 0 .15rem .7rem rgba(0,0,0,.35);
  }
  .logo img { display: block; height: 1.65rem; width: auto; }
  .live { display: inline-flex; align-items: center; gap: .4rem; }
  .pulse {
    width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(63,181,164,.55); animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,181,164,.5); }
    70% { box-shadow: 0 0 0 .55rem rgba(63,181,164,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,181,164,0); }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  /* ---------------- tela dividida ---------------- */
  .split {
    display: grid; grid-template-columns: 1.22fr 1fr; gap: 1.1rem; min-height: 0;
  }
  .lado { display: grid; min-height: 0; gap: 0.8rem; }
  .lado.esq { grid-template-rows: auto 1.06fr 1fr; }
  .lado.dir { grid-template-rows: minmax(0, 1fr); position: relative; }
  .lado.dir::before {
    content: ""; position: absolute; left: -0.55rem; top: .2rem; bottom: .2rem;
    width: 1px; background: var(--line);
  }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.85rem 1rem 0.9rem; min-height: 0;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
  .panel h2 {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.28rem;
    letter-spacing: -.01em; margin: 0;
  }
  .phead .sub {
    font-family: var(--font-ui); font-size: 0.82rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .legend { display: flex; gap: .8rem; }
  .legend span {
    display: inline-flex; align-items: center; gap: .35rem;
    font-family: var(--font-ui); font-size: 0.86rem; color: var(--ink-2);
  }
  .dot { width: .62rem; height: .62rem; border-radius: 2px; display: inline-block; flex: none; }
  .dot.linha { width: .8rem; height: 0; border-top: 2px dashed var(--meta); border-radius: 0; }

  .plot { flex: 1 1 auto; min-height: 0; position: relative; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ax { font-family: var(--font-ui); fill: var(--ink-3); }
  .barlab { font-family: var(--font-ui); font-weight: 700; fill: var(--ink); }
  .foot-note { font-size: 0.95rem; color: var(--ink-3); line-height: 1.35; }
  .foot-note strong { color: var(--ink); }

  /* ---------------- KPIs ---------------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.7rem 0.85rem 0.75rem; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--line); }
  .kpi.a::before { background: var(--accent); }
  .kpi.b::before { background: var(--exp); }
  .kpi.c::before { background: var(--meta); }
  .kpi.d::before { background: var(--ink-2); }
  .kpi .label {
    font-family: var(--font-ui); font-size: 0.66rem;
    letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
    line-height: 1.2; min-height: 2.4em;   /* duas linhas: mantem os 4 valores alinhados */
    display: flex; align-items: flex-end;
  }
  .kpi .value {
    font-family: var(--font-ui); font-weight: 700; font-size: 2.15rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    line-height: 1.08; margin-top: .15rem; white-space: nowrap;
  }
  .kpi .foot {
    font-size: 0.8rem; color: var(--ink-3); margin-top: .2rem;
    display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center; gap: .25rem;
    font-family: var(--font-ui); font-size: 0.76rem; font-weight: 600;
    padding: .1rem .5rem; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .chip.up { color: var(--pos); background: var(--pos-bg); }
  .chip.down { color: var(--neg); background: var(--neg-bg); }
  .chip.hide { display: none; }

  /* ---------------- funil de fases ---------------- */
  .funil { display: flex; flex-direction: column; gap: .45rem; flex: 1 1 auto; justify-content: space-evenly; min-height: 0; }
  .fase {
    display: grid; grid-template-columns: 8.2rem minmax(0, 1fr) auto;
    gap: 0 .7rem; align-items: center;
  }
  .fase-n { font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
  .fase-track { height: 1.5rem; border-radius: .3rem; background: var(--line-soft); overflow: hidden; position: relative; }
  .fase-track i {
    display: block; height: 100%; border-radius: .3rem;
    background: linear-gradient(90deg, var(--accent), #6aa0ff);
  }
  .fase-track b {
    position: absolute; left: .5rem; top: 0; height: 100%;
    display: flex; align-items: center;
    font-family: var(--font-ui); font-weight: 700; font-size: 1rem; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .fase-cv {
    font-family: var(--font-ui); font-size: 0.88rem; font-weight: 600;
    color: var(--ink-3); min-width: 3.6rem; text-align: right; white-space: nowrap;
  }

  /* ---------------- clientes em negociacao ---------------- */
  .total-neg {
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
    padding: .5rem .8rem; border-radius: .55rem;
    background: var(--card-2); border: 1px solid var(--line-soft);
  }
  .total-neg b {
    font-family: var(--font-ui); font-weight: 700; font-size: 2rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .total-neg span { font-size: 0.92rem; color: var(--ink-3); }

  .cards { display: flex; flex-direction: column; gap: .5rem; flex: 1 1 auto; min-height: 0; }
  .cli-card {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto auto auto; gap: .28rem .8rem;
    align-items: center; align-content: center; flex: 1 1 0; min-height: 0;
    padding: .5rem .75rem; background: var(--card-2);
    border: 1px solid var(--line-soft); border-radius: .6rem;
    border-left: 3px solid var(--accent);
  }
  .cli-card.fechamento { border-left-color: var(--exp); }
  .cli-card.negociacao { border-left-color: var(--accent); }
  .cli-card.proposta   { border-left-color: var(--meta); }
  .sigla {
    grid-column: 1; grid-row: 1 / 4; width: 2.9rem; height: 2.9rem; border-radius: .5rem;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-weight: 800; font-size: 0.95rem;
    letter-spacing: -.02em; color: var(--ink); flex: none;
  }
  .cli-top { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .cli-nome {
    font-size: 1.18rem; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pill {
    font-family: var(--font-ui); font-size: 0.66rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    padding: .1rem .45rem; border-radius: 999px; flex: none;
  }
  .pill.fechamento { color: var(--pos); background: var(--pos-bg); }
  .pill.negociacao { color: var(--accent); background: rgba(67,127,239,.16); }
  .pill.proposta   { color: var(--meta); background: rgba(241,134,10,.16); }
  .cli-val {
    grid-column: 3; grid-row: 1 / 3; align-self: center; text-align: right; white-space: nowrap;
    font-family: var(--font-ui); font-weight: 700; font-size: 1.3rem;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .cli-val small {
    display: block; font-family: var(--font-ui); font-weight: 500;
    font-size: 0.72rem; color: var(--ink-3); letter-spacing: .04em; margin-top: .1rem;
  }
  .cli-acao {
    grid-column: 2; grid-row: 2; font-size: 0.92rem; color: var(--ink-2); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cli-acao em { font-style: normal; color: var(--ink-3); }
  .cli-peso {
    grid-column: 2 / 4; grid-row: 3;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 .6rem; align-items: center;
  }
  .cli-peso .b { height: .34rem; border-radius: .2rem; background: var(--line-soft); overflow: hidden; }
  .cli-peso .b i { display: block; height: 100%; border-radius: .2rem; background: var(--accent); }
  .cli-card.fechamento .cli-peso .b i { background: var(--exp); }
  .cli-card.proposta   .cli-peso .b i { background: var(--meta); }
  .cli-peso .p {
    font-family: var(--font-ui); font-size: 0.78rem; font-weight: 600; color: var(--ink-3);
    font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 5.6rem; text-align: right;
  }

  .empty {
    padding: .6rem .8rem; border-radius: .55rem; background: var(--card-2);
    border: 1px dashed var(--line); color: var(--ink-3); font-size: 0.85rem; line-height: 1.35;
  }

  /* aviso de dados ausentes */
  #alerta {
    position: fixed; right: calc(0.55rem + var(--safe-x)); bottom: calc(0.5rem + var(--safe-y));
    background: var(--card); border: 1px solid var(--neg); color: var(--ink);
    border-radius: .6rem; padding: .6rem .9rem; font-size: .85rem; max-width: 34rem;
    box-shadow: 0 .6rem 2rem rgba(0,0,0,.5);
  }
  #alerta b { color: var(--neg); }
  #alerta.hide { display: none; }

  /* telas verticais / quadradas: empilha os dois lados */
  @media (max-aspect-ratio: 1/1) {
    .split { grid-template-columns: 1fr; grid-template-rows: 1.25fr 1fr; }
    .lado.dir::before { display: none; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<script>
(function () {
  var local = location.protocol === "file:";
  var s = document.createElement("script");
  s.src = local ? "dados.js" : "dados.js?v=" + Date.now();
  s.onload = s.onerror = function () { if (window.__COCKPIT_INIT) window.__COCKPIT_INIT(); };
  document.head.appendChild(s);
  setTimeout(function () { location.reload(); }, 10 * 60 * 1000);
})();
</script>
<script>
window.__COCKPIT_INIT = function () {
  "use strict";

  /* ---------------- utilitarios ---------------- */
  const br = (n, d) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const mi = n => br(n, Math.abs(n) >= 10 ? 1 : 1) + " M";
  const pct = (n, d) => br(n * 100, d === undefined ? 0 : d) + "%";
  const soma = a => a.reduce((x, y) => x + y, 0);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
  const el = id => document.getElementById(id);
  const txt = (id, v) => { const e = el(id); if (e) e.textContent = v; };
  const html = (id, v) => { const e = el(id); if (e) e.innerHTML = v; };
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  /* "FECHAMENTO" -> "fechamento" (sem acento), para virar classe css */
  const slug = s => String(s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
  const cap = s => { const t = String(s || "").toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); };

  /* ---------------- margem de seguranca da TV ----------------
     Toda TV corta um pedaco das bordas (overscan). O padrao de 3% resolve a
     maioria; para ajustar, acrescente ?safe=N ao endereco (N de 0 a 10).
     Ex.: ...github.io/indicador-cockpit/?safe=5  (corta muito)
          ...github.io/indicador-cockpit/?safe=0  (TV sem overscan)         */
  (function () {
    try {
      const q = new URLSearchParams(location.search);
      if (!q.has("safe")) return;
      const n = parseFloat(String(q.get("safe")).replace(",", "."));
      if (!isFinite(n) || n < 0 || n > 10) return;
      document.documentElement.style.setProperty("--safe-x", n + "vw");
      document.documentElement.style.setProperty("--safe-y", n + "vh");
    } catch (e) { /* endereco sem parametros: fica no padrao */ }
  })();

  /* ---------------- dados ---------------- */
  const D = window.COCKPIT;
  if (!D || !D.kpis) {
    const a = el("alerta");
    a.innerHTML = '<b>Sem dados.</b> O arquivo <code>dados.js</code> não foi encontrado ou está vazio. ' +
                  'Rode o <b>Atualizar painel.bat</b> na pasta do PowerPoint.';
    a.classList.remove("hide");
    return;
  }

  /* ---------------- topo ---------------- */
  if (D.titulo) txt("t-titulo", D.titulo.replace(/\s+da\s+Semana\s*$/i, ""));
  txt("t-sub", D.subtitulo || "Oportunidades, pipeline por fase e receita vs. meta");
  txt("s-sync", D.atualizado || "—");
  txt("s-arq", D.arquivo || "—");
  txt("s-semana", D.semana || "—");

  /* ---------------- KPIs (texto vindo do PowerPoint) ---------------- */
  (function () {
    const classes = ["a", "b", "c", "d"];
    el("kpis").innerHTML = (D.kpis || []).slice(0, 4).map((k, i) => {
      /* nota do tipo "+4 vs. semana anterior" ganha cor de variacao */
      const nota = String(k.nota || "");
      const m = nota.match(/^([+\-−])\s*([\d.,]+)\s*(.*)$/);
      let pe = esc(nota);
      if (m) {
        const up = m[1] === "+";
        pe = '<span class="chip ' + (up ? "up" : "down") + '">' + (up ? "▲ +" : "▼ −") + esc(m[2]) + "</span>" +
             (m[3] ? ' <span>' + esc(m[3]) + "</span>" : "");
      }
      return '<div class="kpi ' + classes[i] + '">' +
        '<div class="label">' + esc(k.rotulo) + "</div>" +
        '<div class="value">' + esc(k.valor) + "</div>" +
        '<div class="foot">' + pe + "</div>" +
      "</div>";
    }).join("");
  })();

  /* ---------------- funil de fases ---------------- */
  (function () {
    const F = D.fases;
    if (!F || !F.cats || !F.cats.length) {
      html("funil", '<div class="empty">O slide não trouxe o gráfico de oportunidades por fase.</div>');
      return;
    }
    if (D.tituloFases) txt("t-fases", D.tituloFases);
    const total = soma(F.vals);
    const maxV = Math.max.apply(null, F.vals) || 1;
    txt("sub-fases", br(total, 0) + " oportunidades no funil");

    el("funil").innerHTML = F.cats.map((c, i) => {
      const v = F.vals[i] || 0;
      const ant = i ? (F.vals[i - 1] || 0) : 0;
      const cv = i && ant ? "↓ " + pct(v / ant) : "—";
      const rot = i ? "conversão vinda da fase anterior" : "topo do funil";
      return '<div class="fase">' +
        '<div class="fase-n">' + esc(c) + "</div>" +
        '<div class="fase-track"><i style="width:' + (v / maxV * 100).toFixed(1) + '%"></i>' +
          "<b>" + br(v, 0) + "</b></div>" +
        '<div class="fase-cv" title="' + rot + '">' + cv + "</div>" +
      "</div>";
    }).join("");

    const ini = F.vals[0] || 0, fim = F.vals[F.vals.length - 1] || 0;
    html("nota-fases",
      "Do topo ao fechamento: <strong>" + br(ini, 0) + " → " + br(fim, 0) + "</strong> " +
      "(<strong>" + pct(ini ? fim / ini : 0, 1) + "</strong> de conversão fim a fim). " +
      '<span style="opacity:.75">À direita de cada fase, a conversão vinda da fase anterior.</span>');
  })();

  /* ---------------- receita realizada x meta ---------------- */
  const R = D.receita;

  function grafReceita() {
    const host = el("plot-receita");
    if (!host) return;
    if (!R || !R.meses || !R.meses.length) {
      host.innerHTML = "";
      html("nota-receita", '<div class="empty">O slide não trouxe o gráfico de receita x meta.</div>');
      return;
    }
    const W = host.clientWidth, H = host.clientHeight;
    if (!W || !H) return;
    const u = rem();
    const n = R.meses.length;
    const pad = { t: u * 2.2, r: u * 0.8, b: u * 2.9, l: u * 3.2 };
    const iw = Math.max(W - pad.l - pad.r, 10), ih = Math.max(H - pad.t - pad.b, 10);

    const totais = R.total && R.total.length ? R.total
                 : R.meses.map((_, i) => soma((R.barras || []).map(b => b.vals[i] || 0)));
    const metas = R.meta || [];
    const maxReal = Math.max.apply(null, totais.concat(metas));

    /* escala com passos redondos */
    const escala = (mx, divs) => {
      const bruto = mx * 1.12 / divs;
      if (!(bruto > 0)) return divs;
      const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
      const passo = [1, 2, 2.5, 4, 5, 10].map(x => x * mag).find(c => c >= bruto) || 10 * mag;
      return passo * divs;
    };
    const max = escala(maxReal, 4);
    const step = iw / n;
    const bw = Math.min(u * 2.6, step * 0.52);
    const y = v => pad.t + ih - (v / max) * ih;
    const fsAx  = Math.min(u * 0.8, step * 0.30).toFixed(1);
    const fsLab = Math.min(u * 1.0, step * 0.32).toFixed(1);
    const cores = ["--accent", "--meta", "--exp", "--hist"];
    let g = "";

    for (let i = 0; i <= 4; i++) {
      const v = max / 4 * i, yy = y(v);
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + yy + '" y2="' + yy +
           '" stroke="' + css("--grid") + '" stroke-width="1"/>';
      g += '<text class="ax" font-size="' + fsAx + '" x="' + (pad.l - u * 0.4) + '" y="' + (yy + u * 0.25) +
           '" text-anchor="end">' + (v ? br(v, v % 1 ? 1 : 0) : "0") + "</text>";
    }

    /* barras empilhadas */
    R.meses.forEach((mes, i) => {
      const cx = pad.l + step * i + step / 2;
      let acc = 0;
      (R.barras || []).forEach((serie, s) => {
        const v = serie.vals[i] || 0;
        if (!(v > 0)) return;
        const h = (v / max) * ih;
        const yy = pad.t + ih - acc - h;
        g += '<rect x="' + (cx - bw / 2) + '" y="' + yy + '" width="' + bw + '" height="' + Math.max(h, 1) +
             '" fill="' + css(cores[s % cores.length]) + '" rx="1.5"/>';
        acc += h;
      });
      const tot = totais[i] || 0;
      if (tot > 0) {
        g += '<text class="barlab" font-size="' + fsLab + '" x="' + cx + '" y="' + (pad.t + ih - acc - u * 0.4) +
             '" text-anchor="middle">' + br(tot, 1) + "</text>";
      }
      g += '<text class="ax" font-size="' + fsAx + '" x="' + cx + '" y="' + (pad.t + ih + u * 1.05) +
           '" text-anchor="middle">' + esc(mes) + "</text>";
      /* % da meta */
      if (metas[i]) {
        const at = tot / metas[i];
        g += '<text font-size="' + fsAx + '" font-weight="700" x="' + cx + '" y="' + (pad.t + ih + u * 2.15) +
             '" text-anchor="middle" fill="' + css(at >= 1 ? "--pos" : (at >= 0.9 ? "--warn" : "--neg")) + '">' +
             pct(at) + "</text>";
      }
    });

    /* linha da meta */
    if (metas.length) {
      const pts = metas.map((v, i) => [pad.l + step * i + step / 2, y(v)]);
      g += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ") +
           '" fill="none" stroke="' + css("--meta") + '" stroke-width="2" stroke-dasharray="5,4"/>';
      pts.forEach(p => { g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' + css("--meta") + '"/>'; });
    }

    host.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Receita realizada por mês contra a meta">' + g + "</svg>";
  }

  (function textosReceita() {
    if (!R || !R.meses || !R.meses.length) return;
    if (D.tituloReceita) txt("t-receita", D.tituloReceita);
    const cores = ["--accent", "--meta", "--exp", "--hist"];
    el("leg-receita").innerHTML =
      (R.barras || []).map((b, i) =>
        '<span><i class="dot" style="background:var(' + cores[i % cores.length] + ')"></i>' +
        esc(String(b.nome).replace(/\s*\(R\$\s*M\)\s*$/i, "")) + "</span>").join("") +
      (R.meta && R.meta.length ? '<span><i class="dot linha"></i>meta</span>' : "");

    const totais = R.total || [];
    const metas = R.meta || [];
    const iU = totais.length - 1;
    let nota = "Valores em <strong>R$ milhões</strong>. ";
    if (totais.length && metas.length) {
      const at = metas[iU] ? totais[iU] / metas[iU] : 0;
      const cor = at >= 1 ? "var(--pos)" : (at >= 0.9 ? "var(--warn)" : "var(--neg)");
      nota += "Fechamento de <strong>" + esc(R.meses[iU]) + "</strong>: R$ " + br(totais[iU], 1) +
              " M contra meta de R$ " + br(metas[iU], 1) + " M — " +
              '<strong style="color:' + cor + '">' + pct(at) + "</strong> da meta. ";
      const acima = totais.filter((t, i) => metas[i] && t >= metas[i]).length;
      nota += acima + " de " + totais.length + " meses no ou acima do alvo. ";
    }
    nota += '<span style="opacity:.75">% embaixo de cada mês: realizado ÷ meta.</span>';
    html("nota-receita", nota);
  })();

  /* ---------------- clientes em negociacao ---------------- */
  (function clientes() {
    const C = D.clientes || [];
    if (D.tituloClientes) txt("t-clientes", D.tituloClientes);
    txt("neg-total", D.totalValor || "—");
    txt("neg-label", D.totalLabel || (C.length + " contas"));
    txt("sub-clientes", C.length + (C.length === 1 ? " conta" : " contas"));

    if (!C.length) {
      html("cards", '<div class="empty">O slide não trouxe clientes em negociação.</div>');
      return;
    }

    const totalBase = D.totalNum || soma(C.map(c => c.valor || 0)) || 1;
    el("cards").innerHTML = C.map(c => {
      const f = slug(c.fase);
      const share = (c.valor || 0) / totalBase;
      const partes = [];
      if (c.previsao) partes.push("<em>previsão</em> " + esc(c.previsao));
      if (c.responsavel) partes.push("<em>resp.</em> " + esc(c.responsavel));
      return '<div class="cli-card ' + f + '">' +
        '<div class="sigla">' + esc(c.sigla || (c.nome || "").slice(0, 2).toUpperCase()) + "</div>" +
        '<div class="cli-top">' +
          '<span class="cli-nome">' + esc(c.nome) + "</span>" +
          (c.fase ? '<span class="pill ' + f + '">' + esc(cap(c.fase)) + "</span>" : "") +
        "</div>" +
        '<div class="cli-val">' + esc(c.valorTxt || "") +
          (partes.length ? "<small>" + partes.join(" · ") + "</small>" : "") +
        "</div>" +
        '<div class="cli-acao">' + esc(c.acao || "") + "</div>" +
        (c.valor ? '<div class="cli-peso">' +
            '<div class="b"><i style="width:' + (share * 100).toFixed(1) + '%"></i></div>' +
            '<div class="p">' + pct(share, 1) + " do pipeline</div>" +
          "</div>" : "") +
      "</div>";
    }).join("");

    /* leitura rapida: quanto do pipeline esta em fechamento */
    const totalNum = D.totalNum || soma(C.map(c => c.valor || 0));
    const fech = C.filter(c => slug(c.fase) === "fechamento");
    const vFech = soma(fech.map(c => c.valor || 0));
    let nota = "";
    if (totalNum && fech.length) {
      nota = "<strong>" + fech.length + (fech.length === 1 ? " conta" : " contas") + " em fechamento</strong> somam R$ " +
             br(vFech, 0) + " — <strong>" + pct(vFech / totalNum) + "</strong> do pipeline ativo.";
    } else if (totalNum) {
      nota = "Nenhuma conta em fechamento nesta semana; todo o pipeline ativo está em fases anteriores.";
    }
    html("nota-clientes", nota);
  })();

  /* ---------------- redesenho ---------------- */
  grafReceita();
  let t;
  addEventListener("resize", function () { clearTimeout(t); t = setTimeout(grafReceita, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(grafReceita);
};
</script>
